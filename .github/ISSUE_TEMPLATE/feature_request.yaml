name: 💡 Feature request
description: Suggest an idea to help us improve N-Zik Desktop Compagnon
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ****
        ### 💡 READ BEFORE SUBMITTING 💡

        Thanks for taking the time to suggest an idea for N-Zik Desktop Compagnon!
        In-depth details will help us understand your vision and implement it better.

        **Remember: the phone stays the source of truth.** If your idea needs the phone app to expose something new (a new API endpoint, a new field, a new phone-side feature), it must first land in the [N-Zik phone repo](https://github.com/N-Zik-Group/N-Zik) — check there before submitting here.
        ****

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 📝 Before submitting
      description: Please verify the following step before submitting your request.
      options:
        - label: I have checked for already existing feature requests.
          required: true

  - type: checkboxes
    id: impact-assessment
    attributes:
      label: 📊 Impact Assessment
      description: Would this feature benefit many users or is it a niche use case?
      options:
        - label: "This would benefit many users"
        - label: "This is for a specific/niche use case"

  - type: markdown
    attributes:
      value: |
        ****

  - type: textarea
    id: app-information
    attributes:
      label: 🪟 App Information (Optional)
      description: Companion version, Windows version, and the phone's N-Zik version — if this request is tied to a specific setup or a contract feature.
      placeholder: |
        Companion: v0.1.0 (or commit hash)
        Windows: Windows 11 24H2
        N-Zik (phone): 5.0.0-f
    validations:
      required: false

  - type: textarea
    id: problem-statement
    attributes:
      label: 🎯 Problem Statement
      description: What problem does this feature solve? What's your use case?
      placeholder: |
        I want to do '...' because '...', and currently I can only do '...'
    validations:
      required: true

  - type: textarea
    id: suggested-solution
    attributes:
      label: ✨ Description or Suggested Solution
      description: Describe the feature/solution you'd like. A clear and concise description of what you want to happen.
      placeholder: |
        Add a '...' button in the '...' menu to allow users to '...'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives
      description: Describe alternatives you've considered. A clear and concise description of any alternative solutions or features you've considered.
      placeholder: |
        Currently, I have to '...' which is '...', or use another app to '...'
    validations:
      required: false

  - type: textarea
    id: related-links
    attributes:
      label: 🔗 Related Links & References (Optional)
      description: Add links to similar features in other apps, mockups, wireframes, or any other references that help understand this feature request.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ****
