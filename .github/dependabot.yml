# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gradle # See documentation for possible values
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 20
    ignore:
      # Kotlin plugins must be updated in sync with the Kotlin version.
      # Best to do it on the local machine.
      - dependency-name: "org.jetbrains.kotlin.jvm"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
      # The Compose Multiplatform plugin version tracks the Kotlin/Compose
      # releases (currently pinned to an alpha) — bump it locally, in sync.
      - dependency-name: "org.jetbrains.compose"
      # The Compose Multiplatform libraries are pinned to the same alpha as
      # the plugin above — bump them locally, in sync with it.
      - dependency-name: "org.jetbrains.compose.material3:material3"
      - dependency-name: "org.jetbrains.compose.components:components-resources"

  - package-ecosystem: github-actions # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
