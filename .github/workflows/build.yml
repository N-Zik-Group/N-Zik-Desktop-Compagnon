name: Build

env:
  TZ: Europe/Paris

on:
  push:
    branches:
      - main

  pull_request:

  # Allows manual triggering
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR
concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # A red Windows leg must not cancel the Linux leg (and vice versa) —
      # both results are needed to know the state of the build on each OS.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          # Do NOT add `cache: 'gradle'` here — the manual actions/cache below
          # also caches the build state so cache-builder can pre-warm it.
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./app/build
          # Same key contract as cache-builder.yaml — the key includes
          # runner.os, so each OS leg restores its own pre-warmed cache
          # (the pinned VLC zip also lives under ~/.gradle/caches, so it
          # is cached too).
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # PowerShell (the default run shell on Windows) does not resolve
      # executables from the current directory — the .\ prefix is required.
      - name: Build with Gradle (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat build

      - name: Build with Gradle (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew build
