name: Add labels

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  label-build-type-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Detect build type and platform, apply labels
        uses: actions/github-script@v9
        with:
          script: |
            const pcChannelLabels = ["stable pc", "beta pc", "dev pc"];
            const osLabels = ["Windows", "Linux"];

            // The phone's build types (tel dev, tel beta, ...) are applied
            // manually; the companion's bug report does not collect them.

            function detectBuildType(body) {
              const match = (body || "").match(/###\s*🏗️\s*Build Type\s*\n+\s*(.+)/);
              if (!match) return null;
              const value = match[1].trim();
              if (/^Stable/i.test(value)) return "stable pc";
              if (/^Beta/i.test(value)) return "beta pc";
              if (/^Dev/i.test(value)) return "dev pc";
              return null;
            }

            function detectOs(body) {
              const match = (body || "").match(/###\s*🖥️\s*Platform\s*\n+\s*(.+)/);
              if (!match) return null;
              const value = match[1].trim();
              if (/^Windows/i.test(value)) return "Windows";
              if (/^Linux/i.test(value)) return "Linux";
              return null;
            }

            async function applyLabel(issueNumber, label, knownLabels) {
              if (!label) return;

              const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const already = currentLabels.some((l) => l.name === label);

              for (const l of currentLabels) {
                if (knownLabels.includes(l.name) && l.name !== label) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: l.name,
                  });
                }
              }

              if (!already) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
              }

              console.log(`Issue #${issueNumber}: labeled "${label}".`);
            }

            async function processIssue(issueNumber, body) {
              const buildType = detectBuildType(body);
              const os = detectOs(body);
              if (!buildType && !os) {
                console.log(`Issue #${issueNumber}: no matching Build Type or Platform, skipping.`);
                return;
              }
              await applyLabel(issueNumber, buildType, pcChannelLabels);
              await applyLabel(issueNumber, os, osLabels);
            }

            if (context.eventName === "workflow_dispatch") {
              // Walk every issue (open and closed)
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                per_page: 100,
              });

              for (const issue of issues) {
                if (issue.pull_request) continue; // ignore PRs
                await processIssue(issue.number, issue.body);
              }
            } else {
              await processIssue(context.issue.number, context.payload.issue.body);
            }
