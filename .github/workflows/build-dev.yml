name: Build Dev

env:
  TZ: Europe/Paris

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Every day at 0AM
  push:
    branches: [main]

concurrency:
  group: 'dev-deploy'
  cancel-in-progress: false

jobs:
  check-author:
    name: Check if push is from NEVARLeVrai
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Check author and commit message
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"crowdin"* ]] || [[ "$COMMIT_MSG" == *"Crowdin"* ]]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⚠️ Crowdin commit detected, skipping build"
          elif [[ "$COMMIT_MSG" == *"update stats and chart"* ]]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⚠️ Stats/chart update commit detected, skipping build"
          elif [[ "$COMMIT_MSG" == *"In-app contributors list updated"* ]]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⚠️ Contributor list update commit detected, skipping build"
          elif [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⚠️ github-actions[bot] commit detected, skipping build"
          elif [ "$ACTOR" = "NEVARLeVrai" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⚠️ Push not from NEVARLeVrai, skipping build"
          fi

  check-changes:
    name: Check if there are changes
    needs: [check-author]
    if: needs.check-author.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if dev changelog exists
        run: |
          if [ ! -f "Updater/changelogs/dev.txt" ]; then
            echo "Changelog not found. Exiting."
            exit 1
          fi

      - name: Check for changes since last commit
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_TAG=$(date +'%Y%m%d')
          TODAY_DISPLAY=$(date +'%Y-%m-%d')

          export GH_PROMPT_DISABLED=1

          ALREADY_BUILT=$(gh release list --limit 15 | grep -e "-dev-$TODAY_TAG" || echo "")

          if [ ! -z "$ALREADY_BUILT" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ A dev build has already been released today ($TODAY_DISPLAY). Skipping build."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINCE=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)

            COMMITS=$(gh api "repos/${{ github.repository }}/commits?since=$SINCE&author=NEVARLeVrai" \
              --jq '.[] | [.sha, (.commit.message | split("\n")[0])] | @tsv')

            RELEVANT=$(echo "$COMMITS" | grep -viE 'crowdin|update stats and chart|In-app contributors list updated' || true)

            if [ ! -z "$RELEVANT" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✅ New relevant commits from NEVARLeVrai in the last day. Building."
              echo "$RELEVANT"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ No relevant commits from NEVARLeVrai in the last day (or only excluded ones)."
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Push or manual trigger detected. Launching first build of the day."
          fi

  build_time:
    name: Capture current time
    needs: [check-changes]
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
      timestamp: ${{ steps.date.outputs.timestamp }}
    steps:
      - name: Get date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%H:%M Europe/Paris')" >> $GITHUB_OUTPUT

  versioning:
    name: Extract version
    needs: [check-changes]
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      downstream: ${{ steps.downstream.outputs.version }}
      code: ${{ steps.downstream.outputs.code }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Get downstream (local) version
        id: downstream
        run: |
          versionCode=$(grep -E '^\s*nzikVersionCode\s*=' gradle/libs.versions.toml | sed 's/[^0-9]*//g')
          versionName=$(grep -E '^\s*nzikVersionName\s*=' gradle/libs.versions.toml | sed -E 's/.*"(.+)".*/\1/')

          echo "version=$versionName" >> $GITHUB_OUTPUT
          echo "code=$versionCode" >> $GITHUB_OUTPUT

  build-linux:
    needs: [versioning, check-changes, build_time]
    if: needs.check-changes.outputs.changed == 'true'
    name: Build the Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Align the runner OS timezone to Europe/Paris
        run: sudo ln -sf /usr/share/zoneinfo/Europe/Paris /etc/localtime

      - name: Install the build prerequisites (jpackage tools + Flatpak + the AppImage runtime deps)
        # The pinned Linux VLC tarball's audio subset links against the producer's system libraries
        # (scripts/build-vlc-linux-tarball.sh installs the -dev packages), so linuxdeploy (the
        # :app:packageAppImage bundler) must find every external soname on THIS host to deploy it into
        # the AppDir. The producer runs on ubuntu-latest (noble), so exactly its apt packages are
        # required:
        #   libebml5        -> libebml.so.5      (the mkv demux plugin)
        #   libmatroska7    -> libmatroska.so.7  (the mkv demux plugin)
        #   libfaad2        -> libfaad.so.2      (the faad codec plugin)
        #   libasound2t64   -> libasound.so.2    (the ALSA output plugin)
        # The rest (libFLAC/libpulse/libogg/libopus/libvorbis/libmpg123/libsamplerate) are already in the
        # base image. The ubuntu-latest image used to ship VLC (which pulled these in); the image dropped
        # VLC, so the 2026-10-08 dev run failed with "Could not find dependency: libebml.so.5" — and
        # libmatroska.so.7 surfaced next (linuxdeploy reports one missing dependency per file at a time,
        # not the whole list). The tarball pinned then had been built on a WSL 26.04 dev machine and
        # carried sonames noble does not have (libFLAC.so.14 vs noble's libFLAC.so.12) — it was
        # self-heal-rebuilt on noble through the vlc-tarball-builder pipeline. Keep the producer and the
        # consumer on the same distro.
        run: |
          sudo apt-get update
          # zstd: the .pkg.tar.zst compressor of :app:packageArch (the Arch binary package – the
          # 7th Linux path; the task fails loud without it)
          sudo apt-get install -y fakeroot rpm flatpak flatpak-builder libebml5 libmatroska7 libfaad2 libasound2t64 zstd

      - name: Configure the Flathub remote
        run: flatpak remote-add --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Pre-install the Flatpak base runtime
        run: flatpak install --user --noninteractive flathub org.freedesktop.Platform//24.08

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew :app:packageDeb :app:packageRpm :app:packageLinuxPortable :app:packageAppImage :app:packageFlatpak :app:packageArch -Pchannel=dev

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            app/build/compose/binaries/*.zip
            app/build/compose/binaries/*.AppImage
            app/build/compose/binaries/*.flatpak
            app/build/compose/binaries/*.pkg.tar.zst
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm

  build-windows:
    needs: [versioning, check-changes, build_time]
    if: needs.check-changes.outputs.changed == 'true'
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Align the runner OS timezone to Europe/Paris
        run: Set-TimeZone -Id 'Romance Standard Time'

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare the embedded NSIS (tools/nsis — SHA-verified, extracted for $NSIS_DIR)
        # The windows-latest runner migrated to Windows Server 2025, which dropped NSIS from
        # the image (the Windows 2022 image shipped "NSIS 3.10" — that premise broke with the
        # migration; the 2026-10-08 dev run failed with :app:packageInstaller
        # "NSIS (makensis.exe) not found"). The toolchain is embedded
        # in the repo instead (tools/nsis/ — user decision 2026-10-08): verify the single
        # embedded zip against its pinned SHA-256 (fail-loud), extract it to
        # <runner.temp>\nsis (the job env NSIS_DIR), and smoke-check makensis.
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'tools\nsis')) {
            Write-Error "ERROR: tools\nsis is missing from the checkout — failing loud."
            exit 1
          }
          $zips = Get-ChildItem -Path 'tools\nsis' -Filter 'nsis-*.zip' -File
          if ($zips.Count -ne 1) {
            Write-Error "ERROR: expected exactly one embedded NSIS zip in tools\nsis (found $($zips.Count)) — failing loud."
            exit 1
          }
          $zip = $zips[0]
          $shaFile = Join-Path $zip.DirectoryName ($zip.Name + '.sha256')
          if (-not (Test-Path $shaFile)) {
            Write-Error "ERROR: no $($zip.Name).sha256 next to the embedded NSIS zip — failing loud."
            exit 1
          }
          # The .sha256 file holds the bare SHA-256 hex (one line, no file name).
          $expected = (Get-Content $shaFile -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "ERROR: embedded NSIS zip SHA-256 mismatch (expected $expected, got $actual) — the tools\nsis copy is corrupt or was replaced without its .sha256 — failing loud."
            exit 1
          }
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\nsis-extract" -Force
          $tops = Get-ChildItem "$env:RUNNER_TEMP\nsis-extract" -Directory
          if ($tops.Count -ne 1) {
            Write-Error "ERROR: the embedded NSIS zip must contain exactly one top-level folder (found $($tops.Count)) — failing loud."
            exit 1
          }
          $top = $tops[0]
          $dest = Join-Path $env:RUNNER_TEMP 'nsis'
          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }
          Move-Item -Path $top.FullName -Destination $dest
          $makensis = Join-Path $dest 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            Write-Error "ERROR: makensis.exe missing from the extracted NSIS — failing loud."
            exit 1
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: makensis /VERSION failed (exit $LASTEXITCODE) — failing loud."
            exit 1
          }

      - name: Build with Gradle (NSIS)
        # The :app:packageInstaller task resolves $NSIS_DIR\makensis.exe at execution time
        # (findMakensis in app/build.gradle.kts). The NSIS 3.x toolchain ships EMBEDDED in
        # the repo (tools/nsis/ — user decision 2026-10-08: the windows-latest runner
        # migrated to Windows Server 2025, which dropped the NSIS the Windows 2022 image
        # preinstalled, so the build neither relies on the image nor downloads the
        # toolchain). The "Prepare the embedded NSIS" step above verifies the pinned
        # SHA-256 (fail-loud) and extracts the zip to <runner.temp>\nsis (the portable zip
        # ships makensis.exe at the extraction root); nsis-updater.yml opens the update
        # bot PR when the official SourceForge project ships a newer NSIS 3.x. Step-level
        # env: the runner context is not available in a job-level env.
        env:
          NSIS_DIR: ${{ runner.temp }}\nsis
        # PowerShell (the default run shell on Windows) does not resolve executables
        # from the current directory — the .\ prefix is required.
        run: .\gradlew.bat :app:packageInstaller -Pchannel=dev

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact
          path: app/build/compose/binaries/main/exe/*.exe

  upload-to-release:
    needs: [build_time, versioning, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Collect the 7 artifacts and compute the SHA-256
        run: |
          set -euo pipefail

          BASE="${{ needs.versioning.outputs.downstream }}"
          DATE="${{ needs.build_time.outputs.date }}"

          SUFFIX="-dev-${DATE}"
          PKG="n-zik-desktop-compagnon-dev"
          PRODUCT="N-Zik Desktop Compagnon (Dev)"

          EXE="${PRODUCT}-${BASE}${SUFFIX}.exe"
          # The name GitHub stores the .exe as: the asset upload sanitizes the name
          # (space -> dot, "(" -> "", ")" -> "."), so the collect renames the jpackage
          # output to that exact name before upload — the release asset, the SHA-256
          # table and the in-app updater (ArtifactNames.exe) all agree on it.
          EXE_PUB="${EXE// /.}"
          EXE_PUB="${EXE_PUB//(/}"
          EXE_PUB="${EXE_PUB//)/.}"
          DEB="${PKG}_${BASE}${SUFFIX}-1_amd64.deb"
          RPM="${PKG}-${BASE}${SUFFIX}-1.x86_64.rpm"
          ZIP="${PKG}-${BASE}${SUFFIX}-linux-portable.zip"
          APPIMAGE="${PKG}-${BASE}${SUFFIX}-x86_64.AppImage"
          FLATPAK="${PKG}-${BASE}${SUFFIX}-x86_64.flatpak"
          ARCH="${PKG}-${BASE}${SUFFIX}-1-x86_64.pkg.tar.zst"

          # A missing artifact fails the run loud: the CI never "fixes" the
          # packaging contract (it belongs to the build script).
          mkdir -p release
          # upload-artifact stores each file relative to the root directory it detects
          # (the longest common prefix of the upload patterns is stripped from the stored
          # tree): the linux root is app/build/compose/binaries (the deb/rpm keep their
          # main/ sub-dir, the rest sits at the top level) and the windows root is
          # app/build/compose/binaries/main/exe (the bare .exe at the top level) — the
          # paths below are the actual downloaded tree, not the build-dir layout.
          cp "artifacts/linux-artifacts/main/deb/${DEB}" release/
          cp "artifacts/linux-artifacts/main/rpm/${RPM}" release/
          cp "artifacts/linux-artifacts/${ZIP}" release/
          cp "artifacts/linux-artifacts/${APPIMAGE}" release/
          cp "artifacts/linux-artifacts/${FLATPAK}" release/
          cp "artifacts/linux-artifacts/${ARCH}" release/
          cp "artifacts/windows-artifact/${EXE}" "release/${EXE_PUB}"

          cd release
          sha256sum "${EXE_PUB}" "${DEB}" "${RPM}" "${ZIP}" "${APPIMAGE}" "${FLATPAK}" "${ARCH}" > ../SHA256SUMS.txt
          cd ..

          # The markdown SHA-256 table (the artifacts are unsigned — this is
          # the desktop equivalent of the mobile signature-hash section).
          {
            echo "| Artifact | SHA-256 |"
            echo "|----------|---------|"
            while read -r hash name; do
              printf '| %s | %s |\n' "$name" "$hash"
            done < SHA256SUMS.txt
          } > sha_table.md

          cat > release_body.md <<'BODY'
          ## 🔨 Dev Build v@BASE@-dev-@DATE@
          ---

          <div align="center">
            <img alt="N-Zik Desktop Compagnon" src="https://raw.githubusercontent.com/N-Zik-Group/N-Zik-Desktop-Compagnon/main/assets/design/ic_banner2.png" width="1000" />
            <p><b>N-Zik Desktop Compagnon</b> - Development Build</p>
            <p><i>Built from latest commits. For testing & development only.</i></p>
          </div>

          ## 🔎 Verification

          > Always verify the SHA-256 before installing any artifact downloaded from GitHub or other distributors.

          ### SHA-256

          @@SHA_TABLE@@

          ## 📲 Installation

          ⚠️ This is a **DEV build**, not a stable version.  
          It is intended **only for testing and development feedback**.

          1. Download the **Dev build** below.
          2. Verify its SHA-256 using the table above.
          3. Install it on your system:
             - **Windows:** run the installer (it is unsigned - Windows SmartScreen may warn; the dev build is a separate installation, it lives beside the stable/beta one).
             - **Debian / Ubuntu / Mint:** apt install ./<file>.deb
             - **Fedora / openSUSE / Rocky:** dnf install ./<file>.rpm
             - **Arch / Manjaro / CachyOS:** sudo pacman -U ./<file>.pkg.tar.zst
             - **Portable:** unzip the zip and run the launcher in bin/.
             - **AppImage:** run the file directly (needs fuse3; without it: ./<file>.AppImage --appimage-extract-and-run).
             - **Flatpak:** flatpak install ./<file>.flatpak.

          ⚠️ **WARNING:** This build may contain bugs, experimental features, and incomplete functionality. Use only for development testing.

          Please report any crashes, bugs, or unexpected behavior.

          ## 📦 Available Builds

          - **Windows installer** (.exe) – Complete build with all components (x86_64, 64-bit only).
          - **Debian / Ubuntu** (.deb) – Complete build for Debian-based distros (x86_64, 64-bit only).
          - **Fedora / openSUSE / Rocky** (.rpm) – Complete build for RPM-based distros (x86_64, 64-bit only).
          - **Arch / Manjaro / CachyOS** (.pkg.tar.zst) – Prebuilt pacman binary package, installable with `sudo pacman -U` (x86_64, 64-bit only).
          - **Portable** (.zip) – Uncompressed build, no installation needed (x86_64, 64-bit only).
          - **AppImage** – Single-file build, no installation needed (x86_64, 64-bit only).
          - **Flatpak** – Flatpak build (x86_64, 64-bit only).

          > ℹ️ All 7 artifacts are 64-bit only (x86_64).

          ## 🔄 Features

          - 🔧 Built from the latest code commits
          - ⚡ Latest features and improvements (unstable)
          - 🐛 May contain bugs and experimental code
          - 📝 Auto-update is **enabled** (dev builds auto-update to latest dev version)

          ## 🔄 Update Policy

          - 🔴 **Dev Build**
            - **Separate installation:** Installs alongside Stable/Beta as a distinct installation (on Windows every channel is its own installation; on Linux the dev package is n-zik-desktop-compagnon-dev with its own Flatpak app-id).
            - **Default:** Auto-update is **enabled by default**.
            - **User options:**
              - You can **disable auto update** in **Settings > About > the update card**.
            - **Behavior:**
              - Dev builds auto-update to the latest **Dev** release only.
              - Does **not** receive Stable or Beta updates.
              - Does **not** interfere with your Stable or Beta installation.
            - ⚠️ **Note:** This build is for testing and development only. May contain bugs and experimental features.
          BODY

          # Insert the SHA-256 table where the marker stands
          awk '
            /^@@SHA_TABLE@@$/ {
              while ((getline line < "sha_table.md") > 0) print line
              close("sha_table.md")
              next
            }
            { print }
          ' release_body.md > release_body.tmp && mv release_body.tmp release_body.md

          sed -i \
            -e "s|@BASE@|${BASE}|g" \
            -e "s|@DATE@|${DATE}|g" \
            release_body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/**
            SHA256SUMS.txt
          name: v${{ needs.versioning.outputs.downstream }}-dev-${{ needs.build_time.outputs.date }} | 🔨 DEV Build
          tag_name: v${{ needs.versioning.outputs.downstream }}-dev-${{ needs.build_time.outputs.date }}
          prerelease: true
          make_latest: false
          body_path: release_body.md
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true

  cleanup-old-dev-releases:
    needs: [upload-to-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete old dev releases and tags
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Filter only dev releases and sort by date (newest first)
            const devReleases = releases
              .filter(r => r.tag_name.includes('-dev-'))
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            console.log(`📊 Found ${devReleases.length} dev releases`);

            // Keep only the last 2 dev releases
            const releasesToDelete = devReleases.slice(2);

            if (releasesToDelete.length === 0) {
              console.log('✅ Nothing to clean up. Keep all old releases.');
              return;
            }

            for (const release of releasesToDelete) {
              console.log(`🗑️ Deleting release: ${release.tag_name}`);

              // Delete the release
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              // Delete the tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`✅ Tag deleted: ${release.tag_name}`);
              } catch (error) {
                console.log(`⚠️ Could not delete tag ${release.tag_name}: ${error.message}`);
              }
            }

            console.log(`✨ Cleanup complete. Kept ${Math.min(devReleases.length, 2)} latest dev releases.`);

  comment-dev-issues:
    needs: [upload-to-release, versioning, build_time]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment issues marked as "patched DEV" and remove label
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'patched DEV',
              per_page: 100,
            });

            const version = '${{ needs.versioning.outputs.downstream }}-dev-${{ needs.build_time.outputs.date }}';
            const body = [
              `🧪 This issue is fixed in the **DEV** build **v${version}** 🧪`,
              `➤ Download: https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version}`,
              '',
              '> This is a dev release, the ticket stays open until the stable version confirms the fix.'
            ].join('\n');

            for (const issue of issues) {
              if (issue.pull_request) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });

              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'patched DEV'
              });

              console.log(`Commented on issue #${issue.number} and removed label`);
            }

  notify-discord:
    needs: [build_time, versioning, upload-to-release]
    runs-on: ubuntu-latest
    steps:
      - name: 🔨 Dev Build Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTENT: |
            🔨 **||<@&1557313445890760744>|| NEW DEV BUILD v${{ needs.versioning.outputs.downstream }}-dev-${{ needs.build_time.outputs.date }}!**

            🧪 Testing & development snapshot ready!
