name: Build Test (stable dry run)

# Port of the phone repo's build-test.yaml (N-Zik/.github/workflows/build-test.yaml) —
# a manual dry run of the release build pipeline: it builds the full stable set of
# 6 artifacts and exposes them as plain workflow artifacts, WITHOUT publishing
# (no release, no tag, no Discord, no issue automation).
#
# Divergences from the mobile port (documented here by design):
# - No versioning job: on mobile its only usage was copying the changelog into
#   res/raw; the desktop changelog is served through the raw release link (the
#   in-app updater contract), so the job has no purpose here — the stable base
#   version is grepped inline in the collect job.
# - No sign-apks job: the desktop artifacts are unsigned by design (no keystore
#   secrets in this repo) — the collect job replaces it (listing + SHA-256 +
#   artifact re-exposure).
# - No submodules: true on checkout: the desktop repo has no submodules.
# - No guards / verify / publish: this is a test run, not a channel run — it never
#   publishes, so there is nothing to verify against; the channel workflows
#   (build-stable / build-beta / build-dev) are the only publishers.
#
# Prerequisite (fail-loud, same as the channel workflows): the pinned Linux VLC
# tarball vlc-3.0.24-linux-x64.tar.gz must exist as the asset of the prerelease
# carrier vlc-3.0.24-tarball — until then the Linux leg fails loud on
# downloadVlcLinux (its "VLC Linux tarball download failed: HTTP 404" message —
# the docs' TARBALL_404 shorthand); the Windows leg is unaffected and still
# produces the installer.

env:
  TZ: Europe/Paris

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build the Linux packages (stable, dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Align the runner OS timezone to Europe/Paris
        run: sudo ln -sf /usr/share/zoneinfo/Europe/Paris /etc/localtime

      - name: Install the build prerequisites (jpackage tools + Flatpak + the Linux VLC tarball's audio-dep sonames)
         # The pinned Linux VLC tarball's audio subset links against the producer's system libraries
         # (scripts/build-vlc-linux-tarball.sh installs the -dev packages), so the tarball carries
         # external sonames it cannot resolve on its own. For the Flatpak they resolve at run time
         # from the org.freedesktop.Platform base runtime (pre-installed in the step below);
         # flatpak-builder does not scan or deploy host libraries, so nothing is deployed from this
         # host. The producer runs on ubuntu-latest (noble), so the sonames it bakes in match noble:
         #   libebml5        -> libebml.so.5      (the mkv demux plugin)
         #   libmatroska7    -> libmatroska.so.7  (the mkv demux plugin)
         #   libfaad2        -> libfaad.so.2      (the faad codec plugin)
         #   libasound2t64   -> libasound.so.2    (the ALSA output plugin)
         # The rest (libFLAC/libpulse/libogg/libopus/libvorbis/libmpg123/libsamplerate) are already in the
         # base image. The four audio-dep packages above are kept on the build host as a safety margin
         # for the Flatpak staging by the 2026-10-09 AppImage-removal decision (the host-soname scanning
         # they used to feed was the removed AppImage bundler's job); their removal is a follow-up, so
         # the apt-get line is unchanged. The tarball pinned on 2026-10-08 had been built on a WSL 26.04
         # dev machine and carried sonames noble does not have (libFLAC.so.14 vs noble's libFLAC.so.12)
         # — it was self-heal-rebuilt on noble through the vlc-tarball-builder pipeline. Keep the producer
         # and the consumer on the same distro.
        run: |
          sudo apt-get update
          # zstd: the .pkg.tar.zst compressor of :ComposeN-Zik:packageArch (the Arch binary package – one of
          # the five Linux paths; the task fails loud without it)
          sudo apt-get install -y fakeroot rpm flatpak flatpak-builder libebml5 libmatroska7 libfaad2 libasound2t64 zstd

      - name: Configure the Flathub remote
        run: flatpak remote-add --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Pre-install the Flatpak base runtime
        run: flatpak install --user --noninteractive flathub org.freedesktop.Platform//24.08

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./ComposeN-Zik/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew :ComposeN-Zik:packageDeb :ComposeN-Zik:packageRpm :ComposeN-Zik:packageLinuxPortable :ComposeN-Zik:packageFlatpak :ComposeN-Zik:packageArch -Pchannel=stable

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            ComposeN-Zik/build/compose/binaries/*.zip
            ComposeN-Zik/build/compose/binaries/*.flatpak
            ComposeN-Zik/build/compose/binaries/*.pkg.tar.zst
            ComposeN-Zik/build/compose/binaries/main/deb/*.deb
            ComposeN-Zik/build/compose/binaries/main/rpm/*.rpm

  build-windows:
    name: Build the Windows installer (stable, dry run)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Align the runner OS timezone to Europe/Paris
        run: Set-TimeZone -Id 'Romance Standard Time'

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./ComposeN-Zik/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare the embedded NSIS (tools/nsis — SHA-verified, extracted for $NSIS_DIR)
        # The windows-latest runner migrated to Windows Server 2025, which dropped NSIS from
        # the image (the Windows 2022 image shipped "NSIS 3.10" — that premise broke with the
        # migration; the 2026-10-08 dev run failed in the pre-rename Windows-installer task,
        # "NSIS (makensis.exe) not found" — the runner log is quoted verbatim in
        # assets/notes/Done.txt). The toolchain is embedded
        # in the repo instead (tools/nsis/ — user decision 2026-10-08): verify the single
        # embedded zip against its pinned SHA-256 (fail-loud), extract it to
        # <runner.temp>\nsis (the job env NSIS_DIR), and smoke-check makensis.
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'tools\nsis')) {
            Write-Error "ERROR: tools\nsis is missing from the checkout — failing loud."
            exit 1
          }
          $zips = Get-ChildItem -Path 'tools\nsis' -Filter 'nsis-*.zip' -File
          if ($zips.Count -ne 1) {
            Write-Error "ERROR: expected exactly one embedded NSIS zip in tools\nsis (found $($zips.Count)) — failing loud."
            exit 1
          }
          $zip = $zips[0]
          $shaFile = Join-Path $zip.DirectoryName ($zip.Name + '.sha256')
          if (-not (Test-Path $shaFile)) {
            Write-Error "ERROR: no $($zip.Name).sha256 next to the embedded NSIS zip — failing loud."
            exit 1
          }
          # The .sha256 file holds the bare SHA-256 hex (one line, no file name).
          $expected = (Get-Content $shaFile -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "ERROR: embedded NSIS zip SHA-256 mismatch (expected $expected, got $actual) — the tools\nsis copy is corrupt or was replaced without its .sha256 — failing loud."
            exit 1
          }
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\nsis-extract" -Force
          $tops = Get-ChildItem "$env:RUNNER_TEMP\nsis-extract" -Directory
          if ($tops.Count -ne 1) {
            Write-Error "ERROR: the embedded NSIS zip must contain exactly one top-level folder (found $($tops.Count)) — failing loud."
            exit 1
          }
          $top = $tops[0]
          $dest = Join-Path $env:RUNNER_TEMP 'nsis'
          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }
          Move-Item -Path $top.FullName -Destination $dest
          $makensis = Join-Path $dest 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            Write-Error "ERROR: makensis.exe missing from the extracted NSIS — failing loud."
            exit 1
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: makensis /VERSION failed (exit $LASTEXITCODE) — failing loud."
            exit 1
          }

      - name: Build with Gradle (NSIS)
        # The :ComposeN-Zik:packageInstaller task resolves $NSIS_DIR\makensis.exe at execution time
        # (findMakensis in ComposeN-Zik/build.gradle.kts). The NSIS 3.x toolchain ships EMBEDDED in
        # the repo (tools/nsis/ — user decision 2026-10-08: the windows-latest runner
        # migrated to Windows Server 2025, which dropped the NSIS the Windows 2022 image
        # preinstalled, so the build neither relies on the image nor downloads the
        # toolchain). The "Prepare the embedded NSIS" step above verifies the pinned
        # SHA-256 (fail-loud) and extracts the zip to <runner.temp>\nsis (the portable zip
        # ships makensis.exe at the extraction root); nsis-updater.yml opens the update
        # bot PR when the official SourceForge project ships a newer NSIS 3.x. Step-level
        # env: the runner context is not available in a job-level env.
        env:
          NSIS_DIR: ${{ runner.temp }}\nsis
        # PowerShell (the default run shell on Windows) does not resolve executables
        # from the current directory — the .\ prefix is required.
        run: .\gradlew.bat :ComposeN-Zik:packageInstaller :ComposeN-Zik:packageWindowsPortable -Pchannel=stable

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact
          path: |
            ComposeN-Zik/build/compose/binaries/main/exe/*.exe
            ComposeN-Zik/build/compose/binaries/*.zip

  collect:
    name: Collect the 7 artifacts (no publish)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download the built artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: List the artifacts and compute the SHA-256
        run: |
          set -euo pipefail

          # The mobile versioning job is excluded from the port (its only usage
          # was the res/raw changelog copy) — the stable base is grepped inline.
          BASE="$(grep -E '^\s*nzikVersionName\s*=' gradle/libs.versions.toml | awk -F '\"' '{print $2}')"

          SUFFIX=""
          PKG="n-zik-desktop-compagnon"

          # The build writes the installer on the channel's package base (the NSIS task's
          # OUT_FILE) — the same name the published release asset and the in-app updater
          # (ArtifactNames.exe) use
          EXE="${PKG}-${BASE}${SUFFIX}.exe"
          DEB="${PKG}_${BASE}${SUFFIX}-1_amd64.deb"
          RPM="${PKG}-${BASE}${SUFFIX}-1.x86_64.rpm"
          ZIP="${PKG}-${BASE}${SUFFIX}-linux-portable.zip"
          WINZIP="${PKG}-${BASE}${SUFFIX}-windows-portable.zip"
          FLATPAK="${PKG}-${BASE}${SUFFIX}-x86_64.flatpak"
          ARCH="${PKG}-${BASE}${SUFFIX}-1-x86_64.pkg.tar.zst"

          # A missing artifact fails the run loud: the CI never "fixes" the
          # packaging contract (it belongs to the build script).
          mkdir -p release
          # upload-artifact stores each file relative to the root directory it detects
          # (the longest common prefix of the upload patterns is stripped from the stored
          # tree): the linux root is ComposeN-Zik/build/compose/binaries (the deb/rpm keep their
          # main/ sub-dir, the rest sits at the top level) and the windows root is
          # ComposeN-Zik/build/compose/binaries (the .exe keeps its main/exe/ sub-dir, the portable
          # zip sits at the top level) — the paths below are the actual downloaded tree,
          # not the build-dir layout.
          cp "artifacts/linux-artifacts/main/deb/${DEB}" release/
          cp "artifacts/linux-artifacts/main/rpm/${RPM}" release/
          cp "artifacts/linux-artifacts/${ZIP}" release/
          cp "artifacts/linux-artifacts/${FLATPAK}" release/
          cp "artifacts/linux-artifacts/${ARCH}" release/
          cp "artifacts/windows-artifact/main/exe/${EXE}" release/
          cp "artifacts/windows-artifact/${WINZIP}" release/

          echo "Collected the 7 dry-run artifacts:"
          ls -lR release

          cd release
          # The two portable rows are ordered as in the release-body download links (Windows
          # portable before Linux portable): sha256sum runs in that order, and the table iterates SHA256SUMS.txt
          sha256sum "${EXE}" "${DEB}" "${RPM}" "${WINZIP}" "${ZIP}" "${FLATPAK}" "${ARCH}" > ../SHA256SUMS.txt
          cd ..

          # The markdown SHA-256 table (the artifacts are unsigned — this is the
          # desktop equivalent of the mobile signature-hash section).
          {
            echo "| Artifact | SHA-256 |"
            echo "|----------|---------|"
            while read -r hash name; do
              printf '| %s | %s |\n' "$name" "$hash"
            done < SHA256SUMS.txt
          } > sha_table.md

          echo "### SHA-256"
          cat sha_table.md

      - name: Upload the collected artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            release/**
            SHA256SUMS.txt
