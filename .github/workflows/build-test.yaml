name: Build Test (stable dry run)

# Port of the phone repo's build-test.yaml (N-Zik/.github/workflows/build-test.yaml) —
# a manual dry run of the release build pipeline: it builds the full stable set of
# 6 artifacts and exposes them as plain workflow artifacts, WITHOUT publishing
# (no release, no tag, no Discord, no issue automation). spec `spec-ci-build-test`.
#
# Divergences from the mobile port (documented here by design):
# - No `versioning` job: on mobile its only usage was copying the changelog into
#   res/raw; the desktop changelog is served through the raw release link (the
#   in-app updater contract), so the job has no purpose here — the stable base
#   version is grepped inline in the `collect` job.
# - No `sign-apks` job: the desktop artifacts are unsigned by design (no keystore
#   secrets in this repo) — the `collect` job replaces it (listing + SHA-256 +
#   artifact re-exposure).
# - No `submodules: true` on checkout: the desktop repo has no submodules.
# - No guards / verify / publish: this is a test run, not a channel run — it never
#   publishes, so there is nothing to verify against; the channel workflows
#   (build-stable / build-beta / build-dev) are the only publishers.
#
# Prerequisite (fail-loud, same as the channel workflows): the pinned Linux VLC
# tarball `vlc-3.0.24-linux-x64.tar.gz` must exist as the asset of the prerelease
# carrier `vlc-3.0.24-tarball` — until then the Linux leg fails loud on
# `downloadVlcLinux` (its "VLC Linux tarball download failed: HTTP 404" message —
# the docs' `TARBALL_404` shorthand); the Windows leg is unaffected and still
# produces the installer.

env:
  TZ: Europe/Paris

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build the Linux packages (stable, dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Align the runner OS timezone to Europe/Paris
        run: sudo ln -sf /usr/share/zoneinfo/Europe/Paris /etc/localtime

      - name: Install the build prerequisites (jpackage tools + Flatpak + libebml5 for the AppImage)
        # libebml5: the pinned Linux VLC tarball's libmkv_plugin.so carries libebml.so.5 as an
        # external DT_NEEDED (the audio subset links against the build host's libebml —
        # scripts/build-vlc-linux-tarball.sh installs libebml-dev to build it). The
        # ubuntu-latest image used to ship VLC (which pulled in libebml5); the image dropped
        # VLC, so linuxdeploy (the :app:packageAppImage bundler) no longer finds the lib —
        # the 2026-10-08 dev run failed with "Could not find dependency: libebml.so.5".
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm flatpak flatpak-builder libebml5

      - name: Configure the Flathub remote
        run: flatpak remote-add --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Pre-install the Flatpak base runtime
        run: flatpak install --user --noninteractive flathub org.freedesktop.Platform//24.08

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew :app:packageDeb :app:packageRpm :app:packageLinuxPortable :app:packageAppImage :app:packageFlatpak -Pchannel=stable

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            app/build/compose/binaries/*.zip
            app/build/compose/binaries/*.AppImage
            app/build/compose/binaries/*.flatpak
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm

  build-windows:
    name: Build the Windows installer (stable, dry run)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Align the runner OS timezone to Europe/Paris
        run: Set-TimeZone -Id 'Romance Standard Time'

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare the embedded NSIS (tools/nsis — SHA-verified, extracted for $NSIS_DIR)
        # The windows-latest runner migrated to Windows Server 2025, which dropped NSIS from
        # the image (the Windows 2022 image shipped "NSIS 3.10" — the premise recorded in
        # spec-github-ci-canals broke with the migration; the 2026-10-08 dev run failed with
        # :app:packageInstaller "NSIS (makensis.exe) not found"). The toolchain is embedded
        # in the repo instead (tools/nsis/ — user decision 2026-10-08): verify the single
        # embedded zip against its pinned SHA-256 (fail-loud), extract it to
        # <runner.temp>\nsis (the job env NSIS_DIR), and smoke-check makensis.
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'tools\nsis')) {
            Write-Error "ERROR: tools\nsis is missing from the checkout — failing loud."
            exit 1
          }
          $zips = Get-ChildItem -Path 'tools\nsis' -Filter 'nsis-*.zip' -File
          if ($zips.Count -ne 1) {
            Write-Error "ERROR: expected exactly one embedded NSIS zip in tools\nsis (found $($zips.Count)) — failing loud."
            exit 1
          }
          $zip = $zips[0]
          $shaFile = Join-Path $zip.DirectoryName ($zip.Name + '.sha256')
          if (-not (Test-Path $shaFile)) {
            Write-Error "ERROR: no $($zip.Name).sha256 next to the embedded NSIS zip — failing loud."
            exit 1
          }
          # The .sha256 file holds the bare SHA-256 hex (one line, no file name).
          $expected = (Get-Content $shaFile -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "ERROR: embedded NSIS zip SHA-256 mismatch (expected $expected, got $actual) — the tools\nsis copy is corrupt or was replaced without its .sha256 — failing loud."
            exit 1
          }
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\nsis-extract" -Force
          $tops = Get-ChildItem "$env:RUNNER_TEMP\nsis-extract" -Directory
          if ($tops.Count -ne 1) {
            Write-Error "ERROR: the embedded NSIS zip must contain exactly one top-level folder (found $($tops.Count)) — failing loud."
            exit 1
          }
          $top = $tops[0]
          $dest = Join-Path $env:RUNNER_TEMP 'nsis'
          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }
          Move-Item -Path $top.FullName -Destination $dest
          $makensis = Join-Path $dest 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            Write-Error "ERROR: makensis.exe missing from the extracted NSIS — failing loud."
            exit 1
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: makensis /VERSION failed (exit $LASTEXITCODE) — failing loud."
            exit 1
          }

      - name: Build with Gradle (NSIS)
        # The :app:packageInstaller task resolves $NSIS_DIR\makensis.exe at execution time
        # (findMakensis in app/build.gradle.kts). The NSIS 3.x toolchain ships EMBEDDED in
        # the repo (tools/nsis/ — user decision 2026-10-08: the windows-latest runner
        # migrated to Windows Server 2025, which dropped the NSIS the Windows 2022 image
        # preinstalled, so the build neither relies on the image nor downloads the
        # toolchain). The "Prepare the embedded NSIS" step above verifies the pinned
        # SHA-256 (fail-loud) and extracts the zip to <runner.temp>\nsis (the portable zip
        # ships makensis.exe at the extraction root); nsis-updater.yml (spec
        # `spec-nsis-updater-ci`) opens the update bot PR when the official SourceForge
        # project ships a newer NSIS 3.x. Step-level env: the runner context is not
        # available in a job-level env.
        env:
          NSIS_DIR: ${{ runner.temp }}\nsis
        # PowerShell (the default run shell on Windows) does not resolve executables
        # from the current directory — the `.\` prefix is required.
        run: .\gradlew.bat :app:packageInstaller -Pchannel=stable

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact
          path: app/build/compose/binaries/main/exe/*.exe

  collect:
    name: Collect the 6 artifacts (no publish)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download the built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: List the artifacts and compute the SHA-256
        run: |
          set -euo pipefail

          # The mobile `versioning` job is excluded from the port (its only usage
          # was the res/raw changelog copy) — the stable base is grepped inline.
          BASE="$(grep -E '^\s*nzikVersionName\s*=' gradle/libs.versions.toml | awk -F '\"' '{print $2}')"

          SUFFIX=""
          PKG="n-zik-desktop-compagnon"
          PRODUCT="N-Zik Desktop Compagnon"

          EXE="${PRODUCT}-${BASE}${SUFFIX}.exe"
          DEB="${PKG}_${BASE}${SUFFIX}-1_amd64.deb"
          RPM="${PKG}-${BASE}${SUFFIX}-1.x86_64.rpm"
          ZIP="${PKG}-${BASE}${SUFFIX}-linux-portable.zip"
          APPIMAGE="${PKG}-${BASE}${SUFFIX}-x86_64.AppImage"
          FLATPAK="${PKG}-${BASE}${SUFFIX}-x86_64.flatpak"

          # A missing artifact fails the run loud: the CI never "fixes" the
          # packaging contract (it belongs to the build script).
          mkdir -p release
          cp "artifacts/linux-artifacts/app/build/compose/binaries/main/deb/${DEB}" release/
          cp "artifacts/linux-artifacts/app/build/compose/binaries/main/rpm/${RPM}" release/
          cp "artifacts/linux-artifacts/app/build/compose/binaries/${ZIP}" release/
          cp "artifacts/linux-artifacts/app/build/compose/binaries/${APPIMAGE}" release/
          cp "artifacts/linux-artifacts/app/build/compose/binaries/${FLATPAK}" release/
          cp "artifacts/windows-artifact/app/build/compose/binaries/main/exe/${EXE}" release/

          echo "Collected the 6 dry-run artifacts:"
          ls -lR release

          cd release
          sha256sum "${EXE}" "${DEB}" "${RPM}" "${ZIP}" "${APPIMAGE}" "${FLATPAK}" > ../SHA256SUMS.txt
          cd ..

          # The markdown SHA-256 table (the artifacts are unsigned — this is the
          # desktop equivalent of the mobile signature-hash section).
          {
            echo "| Artifact | SHA-256 |"
            echo "|----------|---------|"
            while read -r hash name; do
              printf '| %s | `%s` |\n' "$name" "$hash"
            done < SHA256SUMS.txt
          } > sha_table.md

          echo "### SHA-256"
          cat sha_table.md

      - name: Upload the collected artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            release/**
            SHA256SUMS.txt
