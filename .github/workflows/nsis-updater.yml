name: NSIS Update Checker

# Spec `spec-nsis-updater-ci` — the 5th workflow (not a channel workflow): the NSIS 3.x
# toolchain is EMBEDDED in the repo (tools/nsis/ — user decision 2026-10-08: the
# windows-latest runner migrated to Windows Server 2025, which dropped NSIS from the
# image, so the channel workflows extract the pinned official zip from the repo instead
# of relying on the image or downloading the toolchain at build time). This pipeline
# checks the official SourceForge project for a newer NSIS 3.x release:
#   - no newer release -> a green no-op (explicit message — no download, no PR);
#   - a newer release  -> the windows job downloads the new official zip, SMOKE-COMPILES
#                         app/packaging/windows/installer.nsi with the new makensis (the
#                         proof that the committed installer script still builds with it),
#                         and opens the bot PR bot/nsis-update-<v> (the new zip + its
#                         .sha256 replacing the old pair — the channel workflows are
#                         unchanged: they read the single embedded zip generically).
# The bot never merges: the merge is the human verification gate (rules/BUILD.md). A
# SourceForge fetch failure is fail-loud (curated ERROR — re-dispatch before concluding);
# no update PR is ever opened on a fetch the pipeline could not verify. The Sunday 23:30
# (Europe/Paris, explicit `timezone:`) schedule run is the periodic check.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 0'
      timezone: 'Europe/Paris'

concurrency:
  group: 'nsis-updater'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Compare the embedded NSIS with the official 3.x releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      embedded-version: ${{ steps.decide.outputs.embedded-version }}
      latest-version: ${{ steps.decide.outputs.latest-version }}
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide (no newer release = no-op; newer = update; fetch failure = fail-loud)
        id: decide
        run: |
          set -euo pipefail
          # The embedded version = the single tools/nsis/nsis-<v>.zip file name (the source
          # of truth — the channel workflows read the same file generically). `|| true`:
          # with no match `ls` exits non-zero (pipefail would otherwise abort the step
          # before the curated guard below).
          ZIP_COUNT="$(ls tools/nsis/nsis-*.zip 2>/dev/null | wc -l || true)"
          if [ "$ZIP_COUNT" != "1" ]; then
            echo "ERROR: expected exactly one embedded NSIS zip in tools/nsis/ (found ${ZIP_COUNT}) — failing loud." >&2
            exit 1
          fi
          ZIP="$(ls tools/nsis/nsis-*.zip | head -n1)"
          EMBEDDED_VERSION="$(basename "$ZIP" | sed 's/^nsis-//; s/\.zip$//')"
          # The official 3.x releases = the SourceForge files/NSIS 3/ directory listing
          # (folder names). The project page's "Download Latest Version" banner is STALE
          # (it still advertises 3.09), so the banner is never the source of truth.
          # -sS keeps the curl diagnostics in the log; a fetch failure fails loud below
          # (a transient network / SourceForge outage is NOT "no newer release").
          LIST="$(curl -sS --max-time 30 'https://sourceforge.net/projects/nsis/files/NSIS%203/' || {
            echo "ERROR: fetching the SourceForge NSIS 3 directory listing failed (a transient network / SourceForge outage?) — re-dispatch before concluding; no update PR is opened on a fetch the pipeline could not verify." >&2
            exit 1
          })"
          # `|| true`: with no version folder the grep exits non-zero — under pipefail that
          # would abort the assignment before the curated guard below.
          LATEST_VERSION="$(printf '%s\n' "$LIST" \
            | grep -oE '/projects/nsis/files/NSIS%203/[0-9]+(\.[0-9]+)+/"' \
            | sed 's|/projects/nsis/files/NSIS%203/||; s|/"$||' \
            | sort -V | tail -n1 || true)"
          if [ -z "$LATEST_VERSION" ]; then
            echo "ERROR: the SourceForge listing did not yield a single NSIS 3.x release folder (the page layout changed?) — failing loud; no update PR is opened on an unverifiable fetch." >&2
            exit 1
          fi
          echo "embedded version : $EMBEDDED_VERSION"
          echo "latest version   : $LATEST_VERSION"
          echo "embedded-version=$EMBEDDED_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest-version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s\n' "$EMBEDDED_VERSION" "$LATEST_VERSION" | sort -V | tail -n1)" = "$EMBEDDED_VERSION" ]; then
            echo "NSIS $EMBEDDED_VERSION is the latest official 3.x release — no-op: no download, no PR."
            echo "action=noop" >> "$GITHUB_OUTPUT"
          else
            echo "A newer NSIS release exists: $EMBEDDED_VERSION -> $LATEST_VERSION — the update job will smoke-compile the committed installer with it and open the bot PR."
            echo "action=update" >> "$GITHUB_OUTPUT"
          fi

  update-and-pr:
    name: Smoke-compile the installer with the new NSIS + open the bot PR
    needs: [check-version]
    if: needs.check-version.outputs.action == 'update'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      # gh does NOT auto-use the runner's GITHUB_TOKEN — it must be passed explicitly
      # (gh's own error message says so — the run-#3 lesson of spec-vlc-tarball-ci).
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the new official NSIS zip (SourceForge)
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = "${{ needs.check-version.outputs.latest-version }}"
          $zipOut = "nsis-$latest.zip"
          # The official path (the NSIS 3/<v>/ folder — the folder listing above is the
          # source of truth for the version): downloads.sourceforge.net redirects to the
          # fastest mirror, curl -L follows it.
          curl.exe -sSL --max-time 300 -o $zipOut "https://downloads.sourceforge.net/project/nsis/NSIS%203/$latest/nsis-$latest.zip"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: the official NSIS $latest zip download failed (exit $LASTEXITCODE) — re-dispatch before concluding."
            exit 1
          }
          $size = (Get-Item $zipOut).Length
          if ($size -lt 1MB) {
            Write-Error "ERROR: the downloaded NSIS zip is suspiciously small ($size bytes — an error page from the mirror?) — failing loud (no PR opened on an unverified toolchain)."
            exit 1
          }
          Write-Output "downloaded: $zipOut ($size bytes, SHA-256 $((Get-FileHash -Algorithm SHA256 $zipOut | Select-Object -ExpandProperty Hash).ToLowerInvariant()))"

      - name: Smoke-compile the committed installer with the new makensis (the proof)
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = "${{ needs.check-version.outputs.latest-version }}"
          Expand-Archive -Path "nsis-$latest.zip" -DestinationPath "$env:RUNNER_TEMP\nsis-new" -Force
          $tops = Get-ChildItem "$env:RUNNER_TEMP\nsis-new" -Directory
          if ($tops.Count -ne 1) {
            Write-Error "ERROR: the downloaded NSIS $latest zip must contain exactly one top-level folder (found $($tops.Count)) — failing loud (no PR opened on an unverified layout)."
            exit 1
          }
          $top = $tops[0]
          $makensis = Join-Path $top.FullName 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            # Fallback for a layout change (the current official zip ships makensis.exe at
            # the extraction root AND under Bin/).
            $makensis = Join-Path $top.FullName 'Bin\makensis.exe'
          }
          if (-not (Test-Path $makensis)) {
            Write-Error "ERROR: makensis.exe missing from the downloaded NSIS $latest zip — failing loud (no PR opened on an unverified toolchain)."
            exit 1
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: makensis /VERSION failed (exit $LASTEXITCODE) — failing loud (no PR opened on an unverified toolchain)."
            exit 1
          }
          # The committed installer.nsi needs its 15 Gradle /D defines (see :app:packageInstaller
          # in app/build.gradle.kts) — the smoke compile passes DUMMY channel values + a stub
          # app-image seeded with one placeholder file: installer.nsi does
          # `File /r "${APPIMAGE_DIR}\*.*"` at COMPILE time, and makensis ABORTS on an empty
          # dir ("no files found" — proven by execution), so an empty stub cannot compile.
          # The check is about the NSIS toolchain + the script, not the app content; makensis
          # resolves !include from its own distribution root (the extracted zip provides it),
          # and the only repo file reference is ICON_FILE.
          $stub = "$env:RUNNER_TEMP\nsis-smoke"
          $appimage = Join-Path $stub 'appimage'
          New-Item -ItemType Directory -Force -Path $appimage | Out-Null
          Set-Content -Path (Join-Path $appimage 'smoke-placeholder.txt') -Value 'nsis-updater smoke compile stub'
          & $makensis `
            "/DPRODUCT_NAME=N-Zik Desktop Compagnon (Dev)" `
            "/DCHANNEL=dev" `
            "/DAPP_VERSION=0.0.1-dev-20260101" `
            "/DVERSION_MAJOR=0" `
            "/DVERSION_MINOR=0" `
            "/DVERSION_PATCH=1" `
            "/DVERSION_BUILD=20260101" `
            "/DAPPIMAGE_DIR=$appimage" `
            "/DLAUNCHER_NAME=N-Zik Desktop Compagnon (Dev).exe" `
            "/DOUT_FILE=$(Join-Path $stub 'smoke-installer.exe')" `
            "/DICON_FILE=$(Resolve-Path 'assets/design/icon.ico')" `
            "/DVENDOR=N-Zik Group" `
            "/DDESCRIPTION=smoke compile (nsis-updater)" `
            "/DDATA_DIR_NAME=N-Zik Desktop Compagnon" `
            "/DCRED_TARGET=N-Zik Desktop Compagnon" `
            'app\packaging\windows\installer.nsi'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: the committed installer.nsi failed to compile with NSIS $latest (exit $LASTEXITCODE) — the makensis log above is the diagnosis; no bot PR is opened on a failing toolchain."
            exit 1
          }
          if (-not (Test-Path (Join-Path $stub 'smoke-installer.exe'))) {
            Write-Error "ERROR: makensis reported success but the smoke installer is missing — failing loud."
            exit 1
          }
          Write-Output "SMOKE OK: app\packaging\windows\installer.nsi compiled with NSIS $latest"

      - name: Close the open bot PRs (same version re-run or older version — deterministic replacement)
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = "${{ needs.check-version.outputs.latest-version }}"
          # The branch is fixed per version (bot/nsis-update-<v> + git push -f), so the
          # replacement is: close the open bot PRs, re-push the branch, re-create the PR
          # (gh has no update-PR semantic). This also closes a bot PR left open for an
          # OLDER version (superseded by this run).
          $openBotPrs = gh pr list --state open --limit 100 --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/nsis-update-")) | .number'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: gh pr list failed — cannot verify the open bot PRs; failing loud (no publish)."
            exit 1
          }
          foreach ($n in $openBotPrs) {
            Write-Output "closing open bot PR #${n} (superseded by this run for ${latest})"
            gh pr close "$n" --comment "Superseded by the NSIS update run for ${latest} — the update PR is re-created deterministically on branch bot/nsis-update-<version>. This PR was never merged (the bot never merges — the merge is the human verification gate)."
            if ($LASTEXITCODE -ne 0) {
              # $ErrorActionPreference does not catch native non-zero exits — a failed close
              # would otherwise proceed to gh pr create and die with "a pull request already
              # exists" (the diagnosis would land in the wrong step).
              Write-Error "ERROR: gh pr close failed for PR #${n} (exit $LASTEXITCODE) — failing loud (no publish)."
              exit 1
            }
          }

      - name: Prepare the update branch (the new zip + .sha256 replacing the old pair) + open the bot PR
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = "${{ needs.check-version.outputs.latest-version }}"
          $embedded = "${{ needs.check-version.outputs.embedded-version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "bot/nsis-update-$latest"
          $newSha = (Get-FileHash -Algorithm SHA256 "nsis-$latest.zip" | Select-Object -ExpandProperty Hash).ToLowerInvariant()
          Copy-Item "nsis-$latest.zip" "tools/nsis/nsis-$latest.zip"
          Set-Content -Path "tools/nsis/nsis-$latest.zip.sha256" -Value $newSha
          git add "tools/nsis/nsis-$latest.zip" "tools/nsis/nsis-$latest.zip.sha256"
          git rm -q "tools/nsis/nsis-$embedded.zip" "tools/nsis/nsis-$embedded.zip.sha256"
          # Tools-only guard (the VLC pin-PR pattern, adapted): exactly the 4 expected file
          # operations (the new pair added, the old pair removed), nothing else.
          $changed = (git diff --cached --name-only --diff-filter=ACDMR) | Sort-Object
          $expected = @("tools/nsis/nsis-$embedded.zip", "tools/nsis/nsis-$embedded.zip.sha256", "tools/nsis/nsis-$latest.zip", "tools/nsis/nsis-$latest.zip.sha256") | Sort-Object
          # Compare-Object returns the differing entries ($null when the sets are equal) —
          # a NON-EMPTY result is the failure case.
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $changed
          if ($diff) {
            Write-Error "ERROR: the branch changes more than the tools/nsis pair: $($changed -join ', ') — failing loud."
            exit 1
          }
          git commit -m "chore(tools): update the embedded NSIS from $embedded to $latest"
          git push -f origin "bot/nsis-update-$latest"
          $body = @'
          Updates the embedded NSIS toolchain **@EMBEDDED@ -> @LATEST@** (the official release — the SourceForge NSIS 3 project; the folder listing is the source of truth, the project page banner is stale).

          - New zip: `tools/nsis/nsis-@LATEST@.zip` (SHA-256: `@SHA@`) — replaces `tools/nsis/nsis-@EMBEDDED@.zip`
          - The channel workflows are UNCHANGED: they read the single embedded zip generically (SHA-verified against its .sha256 at build time)
          - **Proof:** `app/packaging/windows/installer.nsi` compiled with the new makensis on this run (the smoke compile passed — the committed installer script is compatible with NSIS @LATEST@)

          > The bot never merges this PR — the merge is the human verification gate (rules/BUILD.md "Windows Installer" — the "NSIS on the build machine" bullet). After merging, dev machines can move to NSIS @LATEST@ (the per-user install in rules/BUILD.md).
          '@
          $body = $body.Replace('@EMBEDDED@', $embedded).Replace('@LATEST@', $latest).Replace('@SHA@', $newSha)
          $body | Out-File -FilePath pr_body.md -Encoding utf8
          gh pr create --base main --head "bot/nsis-update-$latest" --title "chore(tools): update the embedded NSIS from $embedded to $latest" --body-file pr_body.md
