<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #e1e4e8; }
    .text-title { fill: #2b3137; font-weight: 600; font-size: 15px; }
    .chart-line { stroke: #0366d6; fill: none; }
    .chart-dot { fill: #ffffff; stroke: #0366d6; }
    .grad-start { stop-color: #0366d6; stop-opacity: 0.4; }
    .grad-end { stop-color: #0366d6; stop-opacity: 0.0; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .text-title { fill: #c9d1d9; }
      .chart-line { stroke: #58a6ff; }
      .chart-dot { fill: #0d1117; stroke: #58a6ff; }
      .grad-start { stop-color: #58a6ff; stop-opacity: 0.3; }
      .grad-end { stop-color: #58a6ff; stop-opacity: 0.0; }
    }
    
    @keyframes pulse {
      0% { r: 4; stroke-width: 2.5; }
      50% { r: 5.5; stroke-width: 4; stroke-opacity: 0.6; }
      100% { r: 4; stroke-width: 2.5; }
    }
    .dot-pulse { animation: pulse 2s infinite; }
    @keyframes draw {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .animated-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1.5s ease-out forwards;
    }
  </style>
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.05" />
    </filter>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="grad-start"/>
      <stop offset="100%" class="grad-end"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="600" height="160" rx="10" filter="url(#shadow2)" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="25" y="30" class="text-title">📈 Download Growth (Current: 23)</text>
  </g>

  <!-- Area under the line -->
  <path fill="url(#fillGrad)" d="M 35.0,125.0 C 222.3013189042949,125.0 222.3013189042949,113.26086956521739 409.6026378085898,113.26086956521739 C 424.52401082177886,113.26086956521739 424.52401082177886,109.34782608695652 439.4453838349679,109.34782608695652 C 452.57439972945554,109.34782608695652 452.57439972945554,101.52173913043478 465.70341562394316,101.52173913043478 C 485.82262428136625,101.52173913043478 485.82262428136625,66.30434782608695 505.94183293878933,66.30434782608695 C 523.9102130537707,66.30434782608695 523.9102130537707,62.391304347826086 541.8785931687521,62.391304347826086 C 553.439296584376,62.391304347826086 553.439296584376,35.0 565.0,35.0 L 565.0,125 L 35.0,125 Z" />

  <!-- Main curve -->
  <path d="M 35.0,125.0 C 222.3013189042949,125.0 222.3013189042949,113.26086956521739 409.6026378085898,113.26086956521739 C 424.52401082177886,113.26086956521739 424.52401082177886,109.34782608695652 439.4453838349679,109.34782608695652 C 452.57439972945554,109.34782608695652 452.57439972945554,101.52173913043478 465.70341562394316,101.52173913043478 C 485.82262428136625,101.52173913043478 485.82262428136625,66.30434782608695 505.94183293878933,66.30434782608695 C 523.9102130537707,66.30434782608695 523.9102130537707,62.391304347826086 541.8785931687521,62.391304347826086 C 553.439296584376,62.391304347826086 553.439296584376,35.0 565.0,35.0" class="chart-line animated-line" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bright endpoint dot -->
  <circle cx="565.0" cy="35.0" r="4" class="chart-dot dot-pulse" stroke-width="2.5" />
</svg>