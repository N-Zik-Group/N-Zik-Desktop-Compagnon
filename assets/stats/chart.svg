<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #e1e4e8; }
    .text-title { fill: #2b3137; font-weight: 600; font-size: 15px; }
    .chart-line { stroke: #0366d6; fill: none; }
    .chart-dot { fill: #ffffff; stroke: #0366d6; }
    .grad-start { stop-color: #0366d6; stop-opacity: 0.4; }
    .grad-end { stop-color: #0366d6; stop-opacity: 0.0; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .text-title { fill: #c9d1d9; }
      .chart-line { stroke: #58a6ff; }
      .chart-dot { fill: #0d1117; stroke: #58a6ff; }
      .grad-start { stop-color: #58a6ff; stop-opacity: 0.3; }
      .grad-end { stop-color: #58a6ff; stop-opacity: 0.0; }
    }
    
    @keyframes pulse {
      0% { r: 4; stroke-width: 2.5; }
      50% { r: 5.5; stroke-width: 4; stroke-opacity: 0.6; }
      100% { r: 4; stroke-width: 2.5; }
    }
    .dot-pulse { animation: pulse 2s infinite; }
    @keyframes draw {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .animated-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1.5s ease-out forwards;
    }
  </style>
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.05" />
    </filter>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="grad-start"/>
      <stop offset="100%" class="grad-end"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="600" height="160" rx="10" filter="url(#shadow2)" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="25" y="30" class="text-title">📈 Download Growth (Current: 16)</text>
  </g>

  <!-- Area under the line -->
  <path fill="url(#fillGrad)" d="M 35.0,125.0 C 230.84512022630835,125.0 230.84512022630835,108.125 426.6902404526167,108.125 C 442.29225601131543,108.125 442.29225601131543,102.5 457.8942715700141,102.5 C 471.62217114568597,102.5 471.62217114568597,91.25 485.35007072135784,91.25 C 506.38702263083445,91.25 506.38702263083445,40.625 527.4239745403111,40.625 C 546.2119872701555,40.625 546.2119872701555,35.0 565.0,35.0 L 565.0,125 L 35.0,125 Z" />

  <!-- Main curve -->
  <path d="M 35.0,125.0 C 230.84512022630835,125.0 230.84512022630835,108.125 426.6902404526167,108.125 C 442.29225601131543,108.125 442.29225601131543,102.5 457.8942715700141,102.5 C 471.62217114568597,102.5 471.62217114568597,91.25 485.35007072135784,91.25 C 506.38702263083445,91.25 506.38702263083445,40.625 527.4239745403111,40.625 C 546.2119872701555,40.625 546.2119872701555,35.0 565.0,35.0" class="chart-line animated-line" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bright endpoint dot -->
  <circle cx="565.0" cy="35.0" r="4" class="chart-dot dot-pulse" stroke-width="2.5" />
</svg>