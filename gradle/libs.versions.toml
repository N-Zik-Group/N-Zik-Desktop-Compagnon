[versions]
nzikPackageName = "N-Zik Desktop Compagnon"
nzikVersionCode = "1"
nzikVersionName = "0.0.1"
# The MSI-era installation identity (nzikUpgradeUuid / nzikUpgradeUuidDev / nzikPerUser) is GONE
# (the user decision — the NSIS installer replaced the jpackage self-extracting exe; spec
# `spec-updater` Change Log + AD-8 superseded): the NSIS installer uses a registry-based
# per-channel × per-scope version identity instead (app/packaging/windows/installer.nsi — the
# registry key + the exit-code contract are pinned by InstallerContractTest).
# Linux AppImage pins (spec spec-linux-appimage) — SEPARATE from the Windows VLC pins (which live in
# app/build.gradle.kts and are never touched by the AppImage). The Linux tarball is produced one-shot
# from the official VideoLAN source (vlc-3.0.24.tar.xz, official SHA e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf)
# by scripts/build-vlc-linux-tarball.sh; its own SHA-256 is pinned below, and the URL points at the
# asset of the dedicated prerelease carrier release `vlc-3.0.24-tarball` — until that upload lands,
# a fresh-host build fails loud (TARBALL_404) while the Gradle user home cache is used.
vlc-linux-tarball-url = "https://github.com/N-Zik-Group/n-zik-desktop-compagnon/releases/download/vlc-3.0.24-tarball/vlc-3.0.24-linux-x64.tar.gz"
# Re-pinned 2026-10-07 (approved): the original tarball was lost from the build cache and was
# never uploaded to the release, so the original SHA is unrecoverable; the rebuild (same pinned
# official source + same committed script + same audio subset) yields a different binary hash.
vlc-linux-tarball-sha256 = "3a4293f590eab7f4b28b5fd0a6084bf8c59cc7e4ce8d178e0d1429300b71c884"
linuxdeploy-version = "1-alpha-20251107-1"
linuxdeploy-url = "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
linuxdeploy-sha256 = "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
kotlin = "2.4.20"
compose-plugin = "1.13.0-alpha01"
compose-material3 = "1.13.0-alpha01"
junit = "6.1.3"
ktor = "3.6.0"
# In-app updater changelog translation (spec `spec-updater`, loop 2 — the single sanctioned new
# dependency, same version + hard OkHttp runtime requirement as the phone).
translator = "1.1.2"
okhttp3 = "5.5.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
jna = "5.19.1"
zxing = "3.5.4"
graphics-shapes = "1.1.0"
vlcj = "4.12.1"

[libraries]
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose-plugin" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
okhttp3-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp3" }
translator = { group = "com.github.rebelonion", name = "translator", version.ref = "translator" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }
vlcj = { group = "uk.co.caprica", name = "vlcj", version.ref = "vlcj" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
